<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Open Claude session</title>
<style>
  :root { color-scheme: light dark; --bg: #faf9f5; --fg: #1f1e1d; --muted: #6b6a68; --accent: #c96442; }
  @media (prefers-color-scheme: dark) { :root { --bg: #1f1e1d; --fg: #f0eee6; --muted: #a3a19b; } }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--fg);
         font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  main { max-width: 32rem; padding: 2rem 16px; text-align: center; }
  a.button { display: inline-block; margin: 1rem 0; padding: .7rem 1.4rem; border-radius: .5rem;
             background: var(--accent); color: #fff; text-decoration: none; font-weight: 600; }
  p { color: var(--muted); }
  code { word-break: break-all; }
</style>
</head>
<body>
<main>
  <h1 id="title">Opening Claude…</h1>
  <a id="open" class="button" href="#" hidden>Open in Claude</a>
  <p id="note">If nothing happens, click the button. The session opens only on the Mac that ran it, in the Claude desktop app.</p>
</main>
<script>
  (function () {
    var id = decodeURIComponent(location.hash.slice(1));
    var title = document.getElementById("title");
    var note = document.getElementById("note");
    var button = document.getElementById("open");
    if (!/^local_[A-Za-z0-9-]{1,64}$/.test(id)) {
      title.textContent = "No Claude session in this link";
      note.textContent = "Expected a link ending in #local_<session id>.";
      return;
    }
    var target = "claude://claude.ai/epitaxy/" + id;
    button.href = target;
    button.hidden = false;
    var code = document.createElement("code");
    code.textContent = target;
    note.appendChild(document.createElement("br"));
    note.appendChild(code);
    var left = false;
    function leave() {
      if (left) return;
      left = true;
      if (history.length > 1) {
        history.back();
        return;
      }
      window.close();
      setTimeout(function () {
        title.textContent = "Opened in Claude";
        note.textContent = "You can close this tab.";
        button.hidden = true;
      }, 300);
    }
    window.addEventListener("blur", leave);
    document.addEventListener("visibilitychange", function () {
      if (document.hidden) leave();
    });
    location.href = target;
  })();
</script>
</body>
</html>
